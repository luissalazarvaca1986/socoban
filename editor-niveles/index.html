<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sokoban — Editor de niveles</title>
  <link rel="stylesheet" href="estilos.css?v=rejilla-tiles1">
  <link rel="stylesheet" href="../css/editores.css?v=toolbar3">
</head>
<body>
  <main id="app">

    <header>
      <div class="editor-titulo">
      <a class="volver-juego" href="../" title="Volver al juego" aria-label="Volver al juego"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M19 12H5m7-7-7 7 7 7"/></svg></a>
      <h1>Editor de niveles</h1>
    </div>
      <p class="hint">Crea tu propio mapa y desafía tu ingenio y el de tus amigos</p>
    </header>

    <label class="selector-mapa">Mapa Base
      <select id="elegir-mapa" aria-label="Elegir mapa base"><option value="">Nuevo mapa</option></select>
    </label>

    <section id="guardar" aria-label="Guardar">
      <label>Nombre <input id="nombre" type="text" maxlength="40" placeholder="Mi nivel"></label>
      <button type="button" id="btn-guardar" class="accion-mapa" title="Guardar nivel" aria-label="Guardar nivel"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 3h13l4 4v14H3V3h1Zm3 0v6h10V3M7 21v-8h10v8"/></svg></button>
      <p id="mensaje" aria-live="polite"></p>
    </section>

    <section id="controles-mapa" aria-label="Dimensiones">
      <label>Ancho <input id="ancho" type="number" min="4" max="30" value="10"></label>
      <label>Alto  <input id="alto"  type="number" min="4" max="30" value="8"></label>
      <button type="button" id="aplicar-tam" class="accion-mapa" title="Reescalar" aria-label="Reescalar mapa"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M15 20h5v-5M4 4l6 6m4 4 6 6"/></svg></button>
      <button type="button" id="limpiar" class="accion-mapa" title="Vaciar" aria-label="Vaciar mapa"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7m4-7v7"/></svg></button>
    </section>

    <section id="paleta" aria-label="Paleta de tiles">
      <button type="button" class="tile-btn seleccionado" data-ch="#" aria-label="Muro" title="Muro" aria-pressed="true" disabled><canvas width="32" height="32" data-sprite="muro" aria-hidden="true"></canvas></button>
      <button type="button" class="tile-btn" data-ch=" " aria-label="Suelo" title="Suelo" aria-pressed="false" disabled><canvas width="32" height="32" data-sprite="suelo" aria-hidden="true"></canvas></button>
      <button type="button" class="tile-btn" data-ch="." aria-label="Destino" title="Destino" aria-pressed="false" disabled><canvas width="32" height="32" data-sprite="destino" aria-hidden="true"></canvas></button>
      <button type="button" class="tile-btn" data-ch="$" aria-label="Caja" title="Caja" aria-pressed="false" disabled><canvas width="32" height="32" data-sprite="caja" aria-hidden="true"></canvas></button>
      <button type="button" class="tile-btn" data-ch="*" aria-label="Caja en destino" title="Caja en destino" aria-pressed="false" disabled><canvas width="32" height="32" data-sprite="caja_sobre_destino" aria-hidden="true"></canvas></button>
      <button type="button" class="tile-btn" data-ch="@" aria-label="Jugador" title="Jugador" aria-pressed="false" disabled><canvas width="32" height="32" data-sprite="jugador_quieto_0" aria-hidden="true"></canvas></button>
      <button type="button" class="tile-btn" data-ch="borrar" aria-label="Borrar" title="Borrar" aria-pressed="false"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="m15 3 6 6-12 12H5l-4-4L15 3Zm-7 7 6 6M9 21h13"/></svg></button>
    </section>

    <section id="area-mapa" aria-label="Mapa del nivel">
      <div id="mapa"></div>
    </section>



    <section id="guardados" aria-label="Niveles guardados">
      <h2>Niveles guardados</h2>
      <ol id="lista"></ol>
    </section>


  </main>
  <script type="module" src="editor.js?v=rejilla-tiles1"></script>
</body>
</html>
